name: Build iOS IPA
 
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
 
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
 
      # libass-android is a broken submodule entry (no URL in .gitmodules) and is
      # Android-only, so we skip it and only init what iOS needs.
      - name: Init MPVKit submodule
        run: git submodule update --init --recursive -- MPVKit
 
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
 
      - name: Make scripts executable
        run: chmod +x ./gradlew
 
      - name: Detect Xcode project and scheme
        id: detect
        working-directory: iosApp
        run: |
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            echo "flag=-workspace" >> $GITHUB_OUTPUT
            echo "target=$(ls -d *.xcworkspace | head -n1)" >> $GITHUB_OUTPUT
          else
            echo "flag=-project" >> $GITHUB_OUTPUT
            echo "target=$(ls -d *.xcodeproj | head -n1)" >> $GITHUB_OUTPUT
          fi
 
      - name: Build archive (unsigned)
        working-directory: iosApp
        shell: bash
        run: |
          set -eo pipefail
          xcodebuild archive \
            ${{ steps.detect.outputs.flag }} "${{ steps.detect.outputs.target }}" \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Tuvora.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"
 
      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|ARCHIVE FAILED|BUILD FAILED|FAILURE:|What went wrong" "$RUNNER_TEMP/xcodebuild.log" | head -n 40 || true
          echo "--- last 60 lines ---"
          tail -n 60 "$RUNNER_TEMP/xcodebuild.log" || true
 
      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/Tuvora.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n1)
          echo "Found app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Tuvora-unsigned.ipa" Payload
 
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tuvora-unsigned-ipa
          path: Tuvora-unsigned.ipa
          if-no-files-found: error
 
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
 
