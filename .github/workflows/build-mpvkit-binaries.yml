
name: Build MPVKit iOS Binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MPVKit XCFrameworks
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      # 1. Checkout without recursive submodules or persisted credentials
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      # 2. Initialize MPVKit only
      - name: Initialize MPVKit only
        run: |
          git submodule sync MPVKit
          git -c protocol.version=2 submodule update \
            --init --force --depth=1 MPVKit

      # 3. Verify MPVKit revision
      - name: Verify MPVKit revision
        working-directory: MPVKit
        run: |
          EXPECTED="742bf0177a93b353c68de57daa05bc5acd5d61ce"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Incorrect MPVKit revision."
            exit 1
          fi

      # 4. Select Xcode
      - name: Select Xcode 27.1
        run: |
          if [ -d "/Applications/Xcode_27.1.app" ]; then
            sudo xcode-select -s \
              /Applications/Xcode_27.1.app/Contents/Developer
          fi

          xcodebuild -version
          swift --version

      # 5. Install build tools
      - name: Install build tools
        run: |
          brew install nasm sdl2

      # 6. Build MPVKit for iOS and save the build log
      - name: Build MPVKit for iOS
        working-directory: MPVKit
        run: |
          set -o pipefail
          make build platform=ios 2>&1 | tee "$RUNNER_TEMP/mpvkit-build.log"

      # 7. Inspect generated build files
      - name: Inspect MPVKit build output
        if: always()
        run: |
          echo "========== DIST DIRECTORY =========="

          if [ -d "MPVKit/dist" ]; then
            find MPVKit/dist -maxdepth 6 -print
          else
            echo "MPVKit/dist does not exist"
          fi

          echo "========== XCFRAMEWORK DIRECTORIES =========="

          find MPVKit -type d -name "*.xcframework" -print

          echo "========== RELEASE ZIP FILES =========="

          find MPVKit/dist/release -maxdepth 2 -type f -name "*.zip" -print 2>/dev/null || true

          echo "========== LIBPLACEBO DIRECTORY =========="

          find MPVKit/dist/libplacebo-* -maxdepth 5 -print 2>/dev/null || true

          echo "========== LIBPLACEBO BUILD LOG =========="

          if [ -f "$RUNNER_TEMP/mpvkit-build.log" ]; then
            grep -i -E "libplacebo|xcframework|error|failed|skip" \
              "$RUNNER_TEMP/mpvkit-build.log" | tail -n 200 || true
          else
            echo "Build log not found"
          fi

      # 8. Inspect contents of combined archives
      - name: Inspect combined archive contents
        if: always()
        run: |
          for archive in \
            MPVKit/dist/release/FFmpeg-all.zip \
            MPVKit/dist/release/Libmpv-all.zip \
            MPVKit/dist/libplacebo-7.360.1/libplacebo.zip
          do
            echo ""
            echo "========== $archive =========="

            if [ -f "$archive" ]; then
              unzip -l "$archive" | \
                grep -i -E "libplacebo|xcframework|framework|\.a$" | \
                head -n 100 || true
            else
              echo "Archive not found"
            fi
          done

      # 9. Validate generated artifacts
      - name: Validate XCFramework archives
        run: |
          RELEASE_DIR="MPVKit/dist/release"

          FRAMEWORKS=(
            Libplacebo
            Libavcodec
            Libavdevice
            Libavformat
            Libavfilter
            Libavutil
            Libswresample
            Libswscale
            Libmpv
          )

          for name in "${FRAMEWORKS[@]}"; do
            archive="$RELEASE_DIR/$name.xcframework.zip"

            if [ -f "$archive" ]; then
              echo "Found archive: $archive"
              continue
            fi

            framework="$RELEASE_DIR/xcframework/$name.xcframework"

            if [ -d "$framework" ] && [ -f "$framework/Info.plist" ]; then
              echo "Found framework: $framework"
              continue
            fi

            echo "Missing build artifact: $name"
            exit 1
          done

      # 10. Package generated frameworks
      - name: Package XCFrameworks
        run: |
          mkdir -p "$RUNNER_TEMP/mpvkit-release"

          ditto -c -k --sequesterRsrc --keepParent \
            MPVKit/dist/release \
            "$RUNNER_TEMP/mpvkit-release/mpvkit-ios-742bf01.zip"

          cd "$RUNNER_TEMP/mpvkit-release"

          shasum -a 256 mpvkit-ios-742bf01.zip \
            > mpvkit-ios-742bf01.zip.sha256

          cat mpvkit-ios-742bf01.zip.sha256

      # 11. Publish binary release
      - name: Publish MPVKit binary release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mpvkit-742bf01-ios
          name: MPVKit iOS Binaries 742bf01
          target_commitish: main
          files: |
            ${{ runner.temp }}/mpvkit-release/mpvkit-ios-742bf01.zip
            ${{ runner.temp }}/mpvkit-release/mpvkit-ios-742bf01.zip.sha256
          fail_on_unmatched_files: true
          make_latest: false
